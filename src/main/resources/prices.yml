# ShopGUI prices (price PER ITEM).
#
# Each section is one shop. Every line is   ITEM: price
#  * Item names are Bukkit material names:
#    https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
#  * Set a price to 0 (or delete the line) to remove an item from the shop.
#  * You can add more items to any section, in any order.
#  * The "shards" shop is different: the name is the MOB name that is sent to
#    the shard command (see config.yml), and the price is per spawner.
#
# After editing, run  /shop reload  (or restart the server).

